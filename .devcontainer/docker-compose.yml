version: '3.9'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: nextjs-dev-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      - /app/node_modules                  # 避免宿主机与容器 node_modules 冲突
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    command: npm run dev
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge